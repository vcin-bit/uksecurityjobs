<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — UKSecurityJobs</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #06080c; color: #eef2f7; font-family: 'Inter', sans-serif; min-height: 100vh; }

/* LOGIN */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.login-card { background: #0c0f15; border: 1px solid rgba(100,160,220,0.2); padding: 2.5rem; width: 100%; max-width: 380px; }
.login-bar { height: 2px; background: linear-gradient(90deg, #2b6cb8, #60a5fa, #c8d4df); margin-bottom: 2rem; }
.login-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.4rem; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.3rem; }
.login-sub { font-size: 0.8rem; color: #6b7f94; margin-bottom: 1.8rem; }
.login-card input {
  width: 100%; background: #161d29; border: 1px solid rgba(100,140,180,0.15);
  color: #fff; padding: 0.75rem 1rem; font-family: 'Inter', sans-serif; font-size: 0.95rem;
  outline: none; margin-bottom: 0.8rem;
}
.login-card input:focus { border-color: rgba(96,165,250,0.5); }
.btn { width: 100%; background: #2b6cb8; color: #fff; border: none; padding: 0.85rem; font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; cursor: pointer; transition: background 0.2s; }
.btn:hover { background: #3d82d4; }
.login-error { font-size: 0.8rem; color: #f87171; margin-top: 0.8rem; display: none; }

/* DASHBOARD */
.dashboard { display: none; }
.dash-nav { background: #0c0f15; border-bottom: 1px solid rgba(100,160,220,0.15); padding: 0 2rem; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.dash-logo { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.06em; }
.dash-logo span { color: #60a5fa; }
.dash-logout { font-family: 'Rajdhani', sans-serif; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: #6b7f94; cursor: pointer; background: none; border: none; }
.dash-logout:hover { color: #f87171; }

.dash-body { padding: 2rem; max-width: 1200px; margin: 0 auto; }

.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: rgba(100,140,180,0.1); margin-bottom: 2rem; }
.stat-box { background: #0c0f15; padding: 1.5rem; }
.stat-n { font-family: 'Rajdhani', sans-serif; font-size: 2.5rem; font-weight: 700; color: #60a5fa; line-height: 1; }
.stat-l { font-size: 0.72rem; color: #6b7f94; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.3rem; font-family: 'Rajdhani', sans-serif; }

.section-title { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.1em; color: #8fa3b4; margin-bottom: 1rem; }

.filters { display: flex; gap: 0.5rem; margin-bottom: 1.2rem; flex-wrap: wrap; }
.filter-btn { background: #0c0f15; border: 1px solid rgba(100,140,180,0.2); color: #8fa3b4; font-family: 'Rajdhani', sans-serif; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; padding: 0.4rem 0.9rem; cursor: pointer; transition: all 0.2s; }
.filter-btn.active, .filter-btn:hover { background: rgba(43,108,184,0.2); border-color: rgba(96,165,250,0.4); color: #60a5fa; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th { background: #0c0f15; font-family: 'Rajdhani', sans-serif; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #6b7f94; padding: 0.8rem 1rem; text-align: left; border-bottom: 1px solid rgba(100,140,180,0.1); white-space: nowrap; }
tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
tbody tr:hover { background: rgba(43,108,184,0.05); }
tbody td { padding: 0.9rem 1rem; font-size: 0.85rem; color: #c8d4df; vertical-align: middle; }
.td-name { font-weight: 500; color: #fff; }
.td-email { color: #8fa3b4; font-size: 0.8rem; }
.td-sia { font-family: 'Rajdhani', sans-serif; font-size: 0.78rem; color: #60a5fa; letter-spacing: 0.05em; }
.td-date { color: #6b7f94; font-size: 0.78rem; white-space: nowrap; }

.status-badge { display: inline-block; font-family: 'Rajdhani', sans-serif; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; padding: 0.22rem 0.6rem; border-radius: 0; }
.status-pending  { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.25); }
.status-verified { background: rgba(52,211,153,0.12); color: #34d399; border: 1px solid rgba(52,211,153,0.25); }
.status-rejected { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.25); }

.action-select { background: #161d29; border: 1px solid rgba(100,140,180,0.15); color: #8fa3b4; font-family: 'Rajdhani', sans-serif; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; padding: 0.3rem 0.5rem; cursor: pointer; outline: none; }

.loading { text-align: center; padding: 3rem; color: #6b7f94; font-family: 'Rajdhani', sans-serif; text-transform: uppercase; letter-spacing: 0.1em; font-size: 0.85rem; }
.no-data { text-align: center; padding: 3rem; color: #6b7f94; }

@media (max-width: 600px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .dash-body { padding: 1rem; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="login-bar"></div>
    <div class="login-title">Admin Access</div>
    <div class="login-sub">UKSecurityJobs.co.uk — Restricted</div>
    <input type="password" id="passwordInput" placeholder="Enter admin password" autocomplete="current-password">
    <button class="btn" onclick="login()">Access Dashboard →</button>
    <div class="login-error" id="loginError">Incorrect password. Access denied.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <nav class="dash-nav">
    <div class="dash-logo"><span>UK</span>SecurityJobs — Admin</div>
    <button class="dash-logout" onclick="logout()">Log Out</button>
  </nav>

  <div class="dash-body">
    <!-- STATS -->
    <div class="stats-row" id="statsRow">
      <div class="stat-box"><div class="stat-n" id="statTotal">—</div><div class="stat-l">Total Registered</div></div>
      <div class="stat-box"><div class="stat-n" id="statPending">—</div><div class="stat-l">Pending Review</div></div>
      <div class="stat-box"><div class="stat-n" id="statVerified">—</div><div class="stat-l">Verified</div></div>
      <div class="stat-box"><div class="stat-n" id="statToday">—</div><div class="stat-l">Registered Today</div></div>
    </div>

    <!-- FILTERS -->
    <div class="section-title">Candidate Registrations</div>
    <div class="filters">
      <button class="filter-btn active" onclick="filterCandidates('all', this)">All</button>
      <button class="filter-btn" onclick="filterCandidates('pending', this)">Pending</button>
      <button class="filter-btn" onclick="filterCandidates('verified', this)">Verified</button>
      <button class="filter-btn" onclick="filterCandidates('rejected', this)">Rejected</button>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Licence Type</th>
            <th>SIA Number</th>
            <th>Registered</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="candidateTable">
          <tr><td colspan="7" class="loading">Loading candidates...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = 'https://uksecurityjobs-production.up.railway.app';
const licenceLabels = {
  ds: 'Door Supervisor', sg: 'Security Guard', cctv: 'CCTV Operator',
  cp: 'Close Protection', cvit: 'Cash & Valuables in Transit', kh: 'Key Holding', none: 'Not Licensed'
};

let adminPassword = '';
let allCandidates = [];

function login() {
  const pw = document.getElementById('passwordInput').value;
  if (!pw) return;
  adminPassword = pw;
  loadDashboard();
}

document.getElementById('passwordInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') login();
});

async function loadDashboard() {
  try {
    const res = await fetch(`${API}/api/admin/candidates`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword })
    });
    const data = await res.json();
    if (!res.ok) {
      document.getElementById('loginError').style.display = 'block';
      adminPassword = '';
      return;
    }
    allCandidates = data.candidates;
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    renderStats();
    renderTable(allCandidates);
  } catch (err) {
    document.getElementById('loginError').style.display = 'block';
    document.getElementById('loginError').textContent = 'Connection error. Please try again.';
  }
}

function renderStats() {
  const today = new Date().toDateString();
  const total    = allCandidates.length;
  const pending  = allCandidates.filter(c => c.status === 'pending').length;
  const verified = allCandidates.filter(c => c.status === 'verified').length;
  const todayCount = allCandidates.filter(c => new Date(c.registered_at).toDateString() === today).length;
  document.getElementById('statTotal').textContent    = total;
  document.getElementById('statPending').textContent  = pending;
  document.getElementById('statVerified').textContent = verified;
  document.getElementById('statToday').textContent    = todayCount;
}

function renderTable(candidates) {
  const tbody = document.getElementById('candidateTable');
  if (!candidates.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="no-data">No candidates found.</td></tr>';
    return;
  }
  tbody.innerHTML = candidates.map(c => {
    const date = new Date(c.registered_at).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const licence = licenceLabels[c.licence_type] || c.licence_type;
    const statusClass = `status-${c.status}`;
    return `
      <tr>
        <td><div class="td-name">${c.fullname}</div></td>
        <td><div class="td-email">${c.email}</div></td>
        <td>${licence}</td>
        <td><div class="td-sia">${c.sia_number || '—'}</div></td>
        <td><div class="td-date">${date}</div></td>
        <td><span class="status-badge ${statusClass}">${c.status}</span></td>
        <td>
          <select class="action-select" onchange="updateStatus('${c._id}', this.value)">
            <option value="">Update...</option>
            <option value="pending">Pending</option>
            <option value="verified">Verified</option>
            <option value="rejected">Rejected</option>
          </select>
        </td>
      </tr>
    `;
  }).join('');
}

function filterCandidates(filter, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const filtered = filter === 'all' ? allCandidates : allCandidates.filter(c => c.status === filter);
  renderTable(filtered);
}

async function updateStatus(id, status) {
  if (!status) return;
  try {
    const res = await fetch(`${API}/api/admin/update-status`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: adminPassword, id, status })
    });
    if (res.ok) {
      const c = allCandidates.find(c => c._id === id);
      if (c) c.status = status;
      renderStats();
      const activeFilter = document.querySelector('.filter-btn.active').textContent.toLowerCase();
      const filter = activeFilter === 'all' ? 'all' : activeFilter;
      const filtered = filter === 'all' ? allCandidates : allCandidates.filter(c => c.status === filter);
      renderTable(filtered);
    }
  } catch (err) {
    console.error('Update error:', err);
  }
}

function logout() {
  adminPassword = '';
  allCandidates = [];
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').style.display = 'none';
}
</script>

</body>
</html>
