name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install chromium --with-deps

      - name: Run link checker tests
        working-directory: app
        run: npx playwright test tests/links.spec.ts --reporter=list
        env:
          MARKETING_BASE_URL: https://www.uksecurityjobs.co.uk

      - name: Run marketing site tests
        working-directory: app
        run: npx playwright test tests/marketing.spec.ts --reporter=list
        env:
          MARKETING_BASE_URL: https://www.uksecurityjobs.co.uk
        continue-on-error: false

      - name: Run auth tests
        working-directory: app
        run: npx playwright test tests/auth.spec.ts --reporter=list
        env:
          TEST_BASE_URL: https://app.uksecurityjobs.co.uk

      - name: Run profile tests
        working-directory: app
        run: npx playwright test tests/profile.spec.ts --reporter=list
        env:
          TEST_BASE_URL: https://app.uksecurityjobs.co.uk
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Run employer tests
        working-directory: app
        run: npx playwright test tests/employer.spec.ts --reporter=list
        env:
          TEST_BASE_URL: https://app.uksecurityjobs.co.uk
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore
